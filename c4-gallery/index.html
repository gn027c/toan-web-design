<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekong Delta Avian Sanctuary - Responsive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="gallery-header">
        <h1>Mekong Delta Avian Sanctuary</h1>
        <p class="lead">Responsive Photographic Archive of Endemic Waterbirds & Wetland Habitats — Phan Quoc Toan</p>
    </header>

    <main class="gallery-container">
        <section class="responsive-gallery-grid" aria-label="Waterbird Photo Collection">
            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=800&q=80" 
                         alt="Little Egret foraging in shallow delta wetlands" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Little Egret (Egretta garzetta)</h3>
                    <p>Wading predator thriving along freshwater irrigation canal borders.</p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=800&q=80" 
                         alt="Grey Heron perched among riparian willow branches" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Grey Heron (Ardea cinerea)</h3>
                    <p>Solitary fisher nesting within submerged melaleuca forest canopies.</p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1480044965905-02098d419e96?auto=format&fit=crop&w=800&q=80" 
                         alt="Cormorant drying wings on alluvial river bend drift wood" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Great Cormorant (Phalacrocorax carbo)</h3>
                    <p>Expert freshwater diver patrolling deep river confluence estuaries.</p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=800&q=80" 
                         alt="Kingfisher poised over tranquil lotus canal waterway" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Common Kingfisher (Alcedo atthis)</h3>
                    <p>Vibrant precision hunter along tranquil lotus pool waterways.</p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1516642499105-5c1285223030?auto=format&fit=crop&w=800&q=80" 
                         alt="Flock of migratory teal feeding in morning peat swamp mist" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Garganey Migratory Teal (Spatula querquedula)</h3>
                    <p>Seasonal migratory flock resting during the autumn flood season.</p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1534567153574-2b12153a87f0?auto=format&fit=crop&w=800&q=80" 
                         alt="Purple Swamphen striding across floating aquatic reedbeds" 
                         loading="lazy">
                </div>
                <figcaption>
                    <h3>Purple Swamphen (Porphyrio porphyrio)</h3>
                    <p>Graceful wetland walker with specialized elongated toes for reedbeds.</p>
                </figcaption>
            </figure>
        </section>
    </main>

    <footer class="gallery-footer">
        <p>&copy; 2026 Phan Quoc Toan — Advanced Styling with Responsive Design (Course 4 Final Project)</p>
    </footer>
</body>
</html>
